name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (lint · typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - id: pm
        name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm"                              >> $GITHUB_OUTPUT
            echo "install=pnpm install"                         >> $GITHUB_OUTPUT
            echo "run=pnpm run"                           >> $GITHUB_OUTPUT
            echo "audit=pnpm audit --audit-level high"    >> $GITHUB_OUTPUT
            echo "cache=pnpm"                             >> $GITHUB_OUTPUT
            echo "berry=false"                            >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then
            echo "name=yarn"                              >> $GITHUB_OUTPUT
            echo "run=yarn"                               >> $GITHUB_OUTPUT
            echo "audit=yarn npm audit --severity high"   >> $GITHUB_OUTPUT
            echo "cache=yarn"                             >> $GITHUB_OUTPUT
            if [ -f .yarnrc.yml ]; then
              echo "install=yarn install"     >> $GITHUB_OUTPUT
              echo "berry=true"                           >> $GITHUB_OUTPUT
            else
              echo "install=yarn install" >> $GITHUB_OUTPUT
              echo "berry=false"                          >> $GITHUB_OUTPUT
            fi
          elif [ -f bun.lockb ] || [ -f bun.lock ]; then
            echo "name=bun"                               >> $GITHUB_OUTPUT
            echo "install=bun install"  >> $GITHUB_OUTPUT
            echo "run=bun run"                            >> $GITHUB_OUTPUT
            echo "audit="                                 >> $GITHUB_OUTPUT
            echo "cache="                                 >> $GITHUB_OUTPUT
            echo "berry=false"                            >> $GITHUB_OUTPUT
          elif [ -f package-lock.json ]; then
            echo "name=npm"                               >> $GITHUB_OUTPUT
            echo "install=npm install"                    >> $GITHUB_OUTPUT
            echo "run=npm run"                            >> $GITHUB_OUTPUT
            echo "audit=npm audit --audit-level=critical" >> $GITHUB_OUTPUT
            echo "cache=npm"                              >> $GITHUB_OUTPUT
            echo "berry=false"                            >> $GITHUB_OUTPUT
          else
            echo "name=npm"                               >> $GITHUB_OUTPUT
            echo "install=npm install"                    >> $GITHUB_OUTPUT
            echo "run=npm run"                            >> $GITHUB_OUTPUT
            echo "audit=npm audit --audit-level=critical" >> $GITHUB_OUTPUT
            echo "cache="                                 >> $GITHUB_OUTPUT
            echo "berry=false"                            >> $GITHUB_OUTPUT
          fi

      - if: steps.pm.outputs.name == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - if: steps.pm.outputs.name == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - if: steps.pm.outputs.berry == 'true'
        name: Enable Corepack
        run: corepack enable

      - if: steps.pm.outputs.name != 'bun'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ steps.pm.outputs.cache }}

      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Lint
        run: ${{ steps.pm.outputs.run }} lint

      - name: Typecheck
        run: ${{ steps.pm.outputs.run }} typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - id: pm-test
        name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm"                              >> $GITHUB_OUTPUT
            echo "install=pnpm install"                         >> $GITHUB_OUTPUT
            echo "run=pnpm run"                           >> $GITHUB_OUTPUT
            echo "audit=pnpm audit --audit-level high"    >> $GITHUB_OUTPUT
            echo "cache=pnpm"                             >> $GITHUB_OUTPUT
            echo "berry=false"                            >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then
            echo "name=yarn"                              >> $GITHUB_OUTPUT
            echo "run=yarn"                               >> $GITHUB_OUTPUT
            echo "audit=yarn npm audit --severity high"   >> $GITHUB_OUTPUT
            echo "cache=yarn"                             >> $GITHUB_OUTPUT
            if [ -f .yarnrc.yml ]; then
              echo "install=yarn install"     >> $GITHUB_OUTPUT
              echo "berry=true"                           >> $GITHUB_OUTPUT
            else
              echo "install=yarn install" >> $GITHUB_OUTPUT
              echo "berry=false"                          >> $GITHUB_OUTPUT
            fi
          elif [ -f bun.lockb ] || [ -f bun.lock ]; then
            echo "name=bun"                               >> $GITHUB_OUTPUT
            echo "install=bun install"  >> $GITHUB_OUTPUT
            echo "run=bun run"                            >> $GITHUB_OUTPUT
            echo "audit="                                 >> $GITHUB_OUTPUT
            echo "cache="                                 >> $GITHUB_OUTPUT
            echo "berry=false"                            >> $GITHUB_OUTPUT
          elif [ -f package-lock.json ]; then
            echo "name=npm"                               >> $GITHUB_OUTPUT
            echo "install=npm install"                    >> $GITHUB_OUTPUT
            echo "run=npm run"                            >> $GITHUB_OUTPUT
            echo "audit=npm audit --audit-level=critical" >> $GITHUB_OUTPUT
            echo "cache=npm"                              >> $GITHUB_OUTPUT
            echo "berry=false"                            >> $GITHUB_OUTPUT
          else
            echo "name=npm"                               >> $GITHUB_OUTPUT
            echo "install=npm install"                    >> $GITHUB_OUTPUT
            echo "run=npm run"                            >> $GITHUB_OUTPUT
            echo "audit=npm audit --audit-level=critical" >> $GITHUB_OUTPUT
            echo "cache="                                 >> $GITHUB_OUTPUT
            echo "berry=false"                            >> $GITHUB_OUTPUT
          fi

      - if: steps.pm-test.outputs.name == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - if: steps.pm-test.outputs.name == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - if: steps.pm-test.outputs.berry == 'true'
        name: Enable Corepack
        run: corepack enable

      - if: steps.pm-test.outputs.name != 'bun'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ steps.pm-test.outputs.cache }}

      - name: Install dependencies
        run: ${{ steps.pm-test.outputs.install }}

      - name: Run tests
        run: ${{ steps.pm-test.outputs.run }} test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality]
    env:
      PUBLIC_DOODLE_PROJECT_ID: dummy-ci-value
      PUBLIC_FIREBASE_API_KEY: dummy-ci-firebase-key
      PUBLIC_FIREBASE_APP_ID: 1:000:web:000
      PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
      PUBLIC_FIREBASE_MESSAGING_SENDER_ID: dummy-ci-value
      PUBLIC_FIREBASE_PROJECT_ID: dummy-project
      PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
    steps:
      - uses: actions/checkout@v4

      - id: pm-build
        name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm"                              >> $GITHUB_OUTPUT
            echo "install=pnpm install"                         >> $GITHUB_OUTPUT
            echo "run=pnpm run"                           >> $GITHUB_OUTPUT
            echo "audit=pnpm audit --audit-level high"    >> $GITHUB_OUTPUT
            echo "cache=pnpm"                             >> $GITHUB_OUTPUT
            echo "berry=false"                            >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then
            echo "name=yarn"                              >> $GITHUB_OUTPUT
            echo "run=yarn"                               >> $GITHUB_OUTPUT
            echo "audit=yarn npm audit --severity high"   >> $GITHUB_OUTPUT
            echo "cache=yarn"                             >> $GITHUB_OUTPUT
            if [ -f .yarnrc.yml ]; then
              echo "install=yarn install"     >> $GITHUB_OUTPUT
              echo "berry=true"                           >> $GITHUB_OUTPUT
            else
              echo "install=yarn install" >> $GITHUB_OUTPUT
              echo "berry=false"                          >> $GITHUB_OUTPUT
            fi
          elif [ -f bun.lockb ] || [ -f bun.lock ]; then
            echo "name=bun"                               >> $GITHUB_OUTPUT
            echo "install=bun install"  >> $GITHUB_OUTPUT
            echo "run=bun run"                            >> $GITHUB_OUTPUT
            echo "audit="                                 >> $GITHUB_OUTPUT
            echo "cache="                                 >> $GITHUB_OUTPUT
            echo "berry=false"                            >> $GITHUB_OUTPUT
          elif [ -f package-lock.json ]; then
            echo "name=npm"                               >> $GITHUB_OUTPUT
            echo "install=npm install"                    >> $GITHUB_OUTPUT
            echo "run=npm run"                            >> $GITHUB_OUTPUT
            echo "audit=npm audit --audit-level=critical" >> $GITHUB_OUTPUT
            echo "cache=npm"                              >> $GITHUB_OUTPUT
            echo "berry=false"                            >> $GITHUB_OUTPUT
          else
            echo "name=npm"                               >> $GITHUB_OUTPUT
            echo "install=npm install"                    >> $GITHUB_OUTPUT
            echo "run=npm run"                            >> $GITHUB_OUTPUT
            echo "audit=npm audit --audit-level=critical" >> $GITHUB_OUTPUT
            echo "cache="                                 >> $GITHUB_OUTPUT
            echo "berry=false"                            >> $GITHUB_OUTPUT
          fi

      - if: steps.pm-build.outputs.name == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - if: steps.pm-build.outputs.name == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - if: steps.pm-build.outputs.berry == 'true'
        name: Enable Corepack
        run: corepack enable

      - if: steps.pm-build.outputs.name != 'bun'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ steps.pm-build.outputs.cache }}

      - name: Install dependencies
        run: ${{ steps.pm-build.outputs.install }}

      - name: Build
        run: ${{ steps.pm-build.outputs.run }} build

  security-audit:
    name: Security (dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - id: pm-audit
        name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm"                              >> $GITHUB_OUTPUT
            echo "install=pnpm install"                         >> $GITHUB_OUTPUT
            echo "run=pnpm run"                           >> $GITHUB_OUTPUT
            echo "audit=pnpm audit --audit-level high"    >> $GITHUB_OUTPUT
            echo "cache=pnpm"                             >> $GITHUB_OUTPUT
            echo "berry=false"                            >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then
            echo "name=yarn"                              >> $GITHUB_OUTPUT
            echo "run=yarn"                               >> $GITHUB_OUTPUT
            echo "audit=yarn npm audit --severity high"   >> $GITHUB_OUTPUT
            echo "cache=yarn"                             >> $GITHUB_OUTPUT
            if [ -f .yarnrc.yml ]; then
              echo "install=yarn install"     >> $GITHUB_OUTPUT
              echo "berry=true"                           >> $GITHUB_OUTPUT
            else
              echo "install=yarn install" >> $GITHUB_OUTPUT
              echo "berry=false"                          >> $GITHUB_OUTPUT
            fi
          elif [ -f bun.lockb ] || [ -f bun.lock ]; then
            echo "name=bun"                               >> $GITHUB_OUTPUT
            echo "install=bun install"  >> $GITHUB_OUTPUT
            echo "run=bun run"                            >> $GITHUB_OUTPUT
            echo "audit="                                 >> $GITHUB_OUTPUT
            echo "cache="                                 >> $GITHUB_OUTPUT
            echo "berry=false"                            >> $GITHUB_OUTPUT
          elif [ -f package-lock.json ]; then
            echo "name=npm"                               >> $GITHUB_OUTPUT
            echo "install=npm install"                    >> $GITHUB_OUTPUT
            echo "run=npm run"                            >> $GITHUB_OUTPUT
            echo "audit=npm audit --audit-level=critical" >> $GITHUB_OUTPUT
            echo "cache=npm"                              >> $GITHUB_OUTPUT
            echo "berry=false"                            >> $GITHUB_OUTPUT
          else
            echo "name=npm"                               >> $GITHUB_OUTPUT
            echo "install=npm install"                    >> $GITHUB_OUTPUT
            echo "run=npm run"                            >> $GITHUB_OUTPUT
            echo "audit=npm audit --audit-level=critical" >> $GITHUB_OUTPUT
            echo "cache="                                 >> $GITHUB_OUTPUT
            echo "berry=false"                            >> $GITHUB_OUTPUT
          fi

      - if: steps.pm-audit.outputs.name == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - if: steps.pm-audit.outputs.name == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - if: steps.pm-audit.outputs.berry == 'true'
        name: Enable Corepack
        run: corepack enable

      - if: steps.pm-audit.outputs.name != 'bun'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ steps.pm-audit.outputs.cache }}

      - name: Install dependencies
        run: ${{ steps.pm-audit.outputs.install }}

      - name: Audit dependencies
        if: steps.pm-audit.outputs.audit != ''
        run: ${{ steps.pm-audit.outputs.audit }}

  secret-scan:
    name: Security (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan for committed secrets
        run: |
          echo "Scanning for accidentally committed secrets..."
          FAIL=0

          if find . -name "serviceAccountKey.json" -not -path "*/node_modules/*" | grep -q .; then
            echo "FOUND: serviceAccountKey.json committed to repo!"
            FAIL=1
          fi

          if find . -name ".env" -not -name ".env.example" -not -path "*/node_modules/*" | grep -q .; then
            echo "WARNING: .env file found (ensure it contains no real secrets)"
          fi

          if grep -rE "sk_live_[0-9a-zA-Z]+" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" --exclude-dir=node_modules --exclude-dir=dist . 2>/dev/null | grep -qv ".env.example"; then
            echo "FOUND: Hardcoded Stripe LIVE key in source!"
            FAIL=1
          fi

          if grep -rE "AIza[0-9A-Za-z_-]{35}" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" --exclude-dir=node_modules --exclude-dir=dist . 2>/dev/null | grep -qv ".env.example"; then
            echo "WARNING: Possible hardcoded Firebase API key in source"
          fi

          if [ $FAIL -eq 1 ]; then
            echo "Secret scan FAILED — remove secrets before merge."
            exit 1
          fi
          echo "Secret scan passed."
