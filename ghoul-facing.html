<!doctype html>
<meta charset="utf-8" />
<title>Burning ghoul facing check</title>
<style>
  body {
    background: #17111f;
    color: #eee;
    font: 16px system-ui;
    margin: 24px;
  }
  h1 {
    font-size: 20px;
  }
  .frames {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  figure {
    margin: 0;
    padding: 12px;
    background: #302638;
    text-align: center;
  }
  img {
    image-rendering: pixelated;
    width: 342px;
    height: 360px;
    object-fit: contain;
  }

    margin-top: 8px;
  }

<h1>Burning ghoul sprite frame 1</h1>
<div class="frames">
  <figure>
    <img src="public/img/gothicvania/church/ghoul/burning-ghoul1.png" />

  </figure>
  <figure>
    <img
      src="public/img/gothicvania/church/ghoul/burning-ghoul1.png"
      style="transform: scaleX(-1)"
    />
    <figcaption>Mirrored art</figcaption>
  </figure>
